name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: [ '1.27.x', 'stable' ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test -count=1 ./...

  quality:
    name: Vet, race, and 32-bit checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - name: Check module files
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Test 32-bit build
        run: go test -count=1 ./...
        env:
          GOARCH: "386"
